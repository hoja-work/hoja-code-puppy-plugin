[project]
name = "code-puppy-hoja"
dynamic = ["version"]
description = "Hoja for Code Puppy: TaskManage, an evidence-checked task gate, Hoja issue sync and session traces as a Code Puppy plugin."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Hoja" }]
requires-python = ">=3.11,<3.15"
keywords = ["code-puppy", "plugin", "agents", "hoja", "task-tracking", "pydantic-ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Typing :: Typed",
]
dependencies = ["pydantic-ai-hoja>=0.1.0"]

[project.optional-dependencies]
# Code Puppy is the host: install this plugin into its environment rather than pulling it in here.
host = ["code-puppy>=0.0.971"]

[project.entry-points."code_puppy.plugins"]
hoja = "code_puppy_hoja.register_callbacks"

[project.urls]
Homepage = "https://github.com/hoja-work/hoja-code-puppy-plugin"
Repository = "https://github.com/hoja-work/hoja-code-puppy-plugin"
Issues = "https://github.com/hoja-work/hoja-code-puppy-plugin/issues"
Changelog = "https://github.com/hoja-work/hoja-code-puppy-plugin/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["code-puppy>=0.0.971", "pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8", "pyright>=1.1.390"]

[tool.uv.sources]
# Until pydantic-ai-hoja is on PyPI, resolve it from its repository (a sibling checkout during development).
pydantic-ai-hoja = { path = "../hoja-pydantic-ai-plugin", editable = true }

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/code_puppy_hoja/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/code_puppy_hoja"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "README.md", "CHANGELOG.md", "LICENSE", "NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "PT", "C4", "RET"]
ignore = ["PLR0913", "PLR2004", "PLC0415", "RET505"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
